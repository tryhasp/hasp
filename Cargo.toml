[workspace]
resolver = "3"
members = [
    "crates/crypto",
    "crates/proto",
    "crates/core",
    "crates/net",
    "crates/boundary",
    "crates/uniffi",
    "crates/wasm",
    "crates/replay",
    "crates/nmh",
    "crates/adversary",
    "crates/testsupport",
    "crates/e2e",
    "apps/server",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/tryhasp/hasp"
publish = false

[workspace.dependencies]
hasp-crypto = { path = "crates/crypto", version = "0.1.0" }
hasp-proto = { path = "crates/proto", version = "0.1.0" }
hasp-core = { path = "crates/core", version = "0.1.0" }
hasp-net = { path = "crates/net", version = "0.1.0" }
hasp-boundary = { path = "crates/boundary", version = "0.1.0" }
hasp-replay = { path = "crates/replay", version = "0.1.0" }

argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
p256 = { version = "=0.14.0", default-features = false, features = ["alloc", "arithmetic", "ecdsa", "pkcs8"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "zeroize"] }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
hkdf = { version = "=0.13.0", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
sha2-legacy = { package = "sha2", version = "=0.10.9", default-features = false }
x-wing = { version = "=0.1.1", default-features = false, features = ["zeroize", "getrandom"] }
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "getrandom", "mlkem", "chacha"] }
opaque-ke = { version = "=4.0.1", default-features = false }
getrandom = { version = "=0.4.3", default-features = false }

secrecy = { version = "=0.10.3", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc", "derive"] }
subtle = { version = "=2.6.1", default-features = false }

thiserror = { version = "=2.0.21", default-features = false }
tokio-util = { version = "=0.7.20", default-features = false }
tokio = { version = "=1.54.1", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { version = "=0.7.1", default-features = false }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
toml = { version = "=0.9.6", default-features = false, features = ["std", "parse", "serde"] }

serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
libc = "=0.2.191"
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
security-framework-sys = "=2.17.0"
url = { version = "=2.5.8", default-features = false, features = ["std"] }
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
icu_casemap = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
csv = { version = "=1.4.0", default-features = false }
uniffi = { version = "=0.32.2", default-features = false }
wasm-bindgen = { version = "=0.2.130", default-features = false, features = ["std"] }
wasm-bindgen-futures = { version = "=0.4.80", default-features = false }
js-sys = { version = "=0.3.107", default-features = false }
tsify = { version = "=0.5.8", default-features = false, features = ["js"] }
bolero = { version = "=0.13.7" }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

rpassword = { version = "=7.5.5", default-features = false }
qrcode = { version = "=0.14.1", default-features = false }
security-framework = { version = "=3.7.0", default-features = false }
assert_cmd = { version = "=2.2.2", default-features = false }
tempfile = { version = "=3.27.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
mod_module_files = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
panic_in_result_fn = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true
debug-assertions = false
strip = "symbols"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
