name: Hasp
options:
  bundleIdPrefix: kr.jmo.hasp
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '18.0'
    macOS: '15.0'
  xcodeVersion: '2700'
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
    SWIFT_UPCOMING_FEATURE_INFER_ISOLATED_CONFORMANCES: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    EXCLUDED_ARCHS[sdk=macosx*]: x86_64
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      STRIP_INSTALLED_PRODUCT: YES
      DEPLOYMENT_POSTPROCESSING: YES
packages:
  Hasp:
    path: Packages/Hasp
targets:
  Hasp:
    type: application
    supportedDestinations: [macOS]
    sources:
      - App/Mac
    dependencies:
      - package: Hasp
        product: HaspUI
      - package: Hasp
        product: HaspKit
      - package: Hasp
        product: HaspPlatform
      - package: Hasp
        product: HaspQuickAccessCore
      - package: Hasp
        product: HaspQuickAccess
      - package: Hasp
        product: HaspProvider
      - target: HaspSafari
      - target: HaspAutoFill
    postCompileScripts:
      - script: '"${SRCROOT}/../../scripts/apple-embed-helper.sh"'
        name: Embed native messaging helper
        basedOnDependencyAnalysis: false
    info:
      path: App/Config/Hasp-Info.plist
      properties:
        CFBundleDisplayName: Hasp
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko, en]
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: AGPL-3.0-or-later
        HaspChromiumExtensionIDs: []
        HaspFirefoxExtensionIDs: []
        HaspDevChromiumExtensionID: $(HASP_DEV_CHROMIUM_EXTENSION_ID)
        HaspDevFirefoxExtensionID: $(HASP_DEV_FIREFOX_EXTENSION_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.jmo.hasp
        PRODUCT_NAME: Hasp
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        HASP_ENTITLEMENTS_SUFFIX: ''
        CODE_SIGN_ENTITLEMENTS: App/Config/Hasp$(HASP_ENTITLEMENTS_SUFFIX).entitlements
        HASP_DEV_CHROMIUM_EXTENSION_ID: ''
        HASP_DEV_FIREFOX_EXTENSION_ID: ''
      configs:
        Debug:
          HASP_DEV_CHROMIUM_EXTENSION_ID: gchilemfcapcihefglfdhgihpcjcdogp
          HASP_DEV_FIREFOX_EXTENSION_ID: hasp-dev@hasp.app
  HaspSafari:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - App/SafariExtension
    dependencies:
      - package: Hasp
        product: HaspKit
      - package: Hasp
        product: HaspPlatform
    postCompileScripts:
      - script: '"${SRCROOT}/../../scripts/apple-safari-resources.sh"'
        name: Embed the built Safari extension
        basedOnDependencyAnalysis: false
    info:
      path: App/Config/HaspSafari-Info.plist
      properties:
        CFBundleDisplayName: Hasp
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        HaspKeychainAccessGroup: $(AppIdentifierPrefix)kr.jmo.hasp.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.jmo.hasp.safari
        PRODUCT_NAME: HaspSafari
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        HASP_ENTITLEMENTS_SUFFIX: ''
        CODE_SIGN_ENTITLEMENTS: App/Config/HaspSafari$(HASP_ENTITLEMENTS_SUFFIX).entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: App/Config/HaspSafariIOS$(HASP_ENTITLEMENTS_SUFFIX).entitlements
  HaspAutoFill:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - App/CredentialProvider
    dependencies:
      - package: Hasp
        product: HaspProvider
      - package: Hasp
        product: HaspProviderUI
      - package: Hasp
        product: HaspKit
      - package: Hasp
        product: HaspPlatform
    info:
      path: App/Config/HaspAutoFill-Info.plist
      properties:
        CFBundleDisplayName: Hasp
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        HaspKeychainAccessGroup: $(AppIdentifierPrefix)kr.jmo.hasp.shared
        NSFaceIDUsageDescription: Unlock your Hasp vault with Face ID.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionShowsConfigurationUI: true
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              ProvidesOneTimeCodes: true
              ProvidesTextToInsert: true
              SupportsCredentialExchange: true
              SupportedCredentialExchangeVersions: ['1.0']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.jmo.hasp.autofill
        PRODUCT_NAME: HaspAutoFill
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        HASP_ENTITLEMENTS_SUFFIX: ''
        CODE_SIGN_ENTITLEMENTS: App/Config/HaspAutoFill$(HASP_ENTITLEMENTS_SUFFIX).entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Config/HaspAutoFillMac$(HASP_ENTITLEMENTS_SUFFIX).entitlements
  HaspUITests:
    type: bundle.ui-testing
    supportedDestinations: [macOS]
    sources:
      - UITests
    dependencies:
      - target: Hasp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.jmo.hasp.uitests
        TEST_TARGET_NAME: Hasp
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
  HaspPhone:
    type: application
    supportedDestinations: [iOS]
    sources:
      - App/Phone
      - path: App/Mac/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: App/Mac/Resources/TemplateLabels.xcstrings
        buildPhase: resources
    dependencies:
      - package: Hasp
        product: HaspUI
      - package: Hasp
        product: HaspKit
      - package: Hasp
        product: HaspPlatform
      - package: Hasp
        product: HaspQuickAccessCore
      - package: Hasp
        product: HaspProvider
      - target: HaspSafari
      - target: HaspAutoFill
    info:
      path: App/Config/Phone-Info.plist
      properties:
        CFBundleDisplayName: Hasp
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko, en]
        HaspKeychainAccessGroup: $(AppIdentifierPrefix)kr.jmo.hasp.shared
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [kr.jmo.hasp.refresh]
        NSFaceIDUsageDescription: Unlock your Hasp vault with Face ID.
        NSUserActivityTypes: [ASCredentialExchangeActivity]
        NSCameraUsageDescription: Scan the QR code on your Hasp Emergency Kit.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.jmo.hasp
        PRODUCT_NAME: Hasp
        TARGETED_DEVICE_FAMILY: '1,2'
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        HASP_ENTITLEMENTS_SUFFIX: ''
        CODE_SIGN_ENTITLEMENTS: App/Config/Phone$(HASP_ENTITLEMENTS_SUFFIX).entitlements
  HaspPhoneUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - PhoneUITests
    dependencies:
      - target: HaspPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.jmo.hasp.phoneuitests
        TEST_TARGET_NAME: HaspPhone
        GENERATE_INFOPLIST_FILE: YES
  HaspProviderMemoryHost:
    type: application
    supportedDestinations: [iOS]
    sources:
      - ProviderMemoryHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.jmo.hasp.providermemoryhost
        PRODUCT_NAME: ProviderMemoryHost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  HaspProviderMemoryTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - ProviderMemoryTests
    dependencies:
      - target: HaspProviderMemoryHost
      - package: Hasp
        product: HaspProvider
      - package: Hasp
        product: HaspProviderUI
      - package: Hasp
        product: HaspKit
      - package: Hasp
        product: HaspPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.jmo.hasp.providermemorytests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ProviderMemoryHost.app/ProviderMemoryHost
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Hasp:
    build:
      targets:
        Hasp: all
    test:
      targets:
        - HaspUITests
      gatherCoverageData: false
    run:
      config: Debug
  HaspSafari:
    build:
      targets:
        HaspSafari: all
  HaspAutoFill:
    build:
      targets:
        HaspAutoFill: all
  HaspPhone:
    build:
      targets:
        HaspPhone: all
    test:
      targets:
        - HaspPhoneUITests
      gatherCoverageData: false
    run:
      config: Debug
  HaspProviderMemory:
    build:
      targets:
        HaspProviderMemoryHost: all
        HaspProviderMemoryTests: all
    test:
      targets:
        - HaspProviderMemoryTests
      gatherCoverageData: false
