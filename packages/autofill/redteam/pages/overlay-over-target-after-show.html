<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>overlay-over-target-after-show</title><style>body{font:14px sans-serif;margin:40px}form{width:320px;max-width:100%}input{display:block;width:300px;max-width:100%;height:32px;margin:8px 0}</style></head><body><form id="f" method="post" action="#"><input id="u" name="username" autocomplete="username" ><input id="p" name="password" type="password" autocomplete="current-password"><button type="submit">Sign in</button></form><script>window.attack=()=>{const r=document.getElementById("u").getBoundingClientRect();const d=document.createElement("div");d.style.cssText="position:fixed;z-index:9;background:rgba(0,0,0,.01);left:"+r.left+"px;top:"+r.top+"px;width:"+r.width+"px;height:"+r.height+"px";document.body.append(d)}</script></body></html>
