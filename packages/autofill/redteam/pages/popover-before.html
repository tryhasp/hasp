<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>popover-before</title><style>body{font:14px sans-serif;margin:40px}form{width:320px;max-width:100%}input{display:block;width:300px;max-width:100%;height:32px;margin:8px 0}</style></head><body><form id="f" method="post" action="#"><input id="u" name="username" autocomplete="username" ><input id="p" name="password" type="password" autocomplete="current-password"><button type="submit">Sign in</button></form><div id="pop" popover="manual" style="position:fixed;inset:0;margin:0;border:0;padding:0;background:transparent;width:100%;height:100%"></div><script>addEventListener("load",()=>{document.getElementById("pop").showPopover()})</script></body></html>
