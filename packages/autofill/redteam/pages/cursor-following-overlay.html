<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>cursor-following-overlay</title><style>body{font:14px sans-serif;margin:40px}form{width:320px;max-width:100%}input{display:block;width:300px;max-width:100%;height:32px;margin:8px 0}#ov{position:fixed;width:200px;height:200px;background:rgba(0,0,0,.01);z-index:2147483646;pointer-events:auto}</style></head><body><form id="f" method="post" action="#"><input id="u" name="username" autocomplete="username" ><input id="p" name="password" type="password" autocomplete="current-password"><button type="submit">Sign in</button></form><div id="ov"></div><script>addEventListener("pointermove",(e)=>{const o=document.getElementById("ov");o.style.left=(e.clientX-100)+"px";o.style.top=(e.clientY-100)+"px"})</script></body></html>
